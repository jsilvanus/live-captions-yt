[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lcyt-stt"
version = "0.1.0"
description = "LCYT self-hosted speech-to-text inference service (faster-whisper) and dataset pipeline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "jsilvanus" }
]
keywords = ["speech-to-text", "whisper", "faster-whisper", "transcription", "captions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "datasets>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
lcyt-stt = "lcyt_stt.cli:main"

[project.urls]
Homepage = "https://github.com/jsilvanus/live-captions-yt"
Repository = "https://github.com/jsilvanus/live-captions-yt"
Issues = "https://github.com/jsilvanus/live-captions-yt/issues"

[tool.hatch.build.targets.wheel]
packages = ["lcyt_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
