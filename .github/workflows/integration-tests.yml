name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# Packages are discovered, not listed: every directory under packages/ and
# packages/plugins/ whose package.json has a "test" script is tested on main and
# on workflow changes; on a PR only the changed ones (plus the backend when a
# plugin changed). A new package or plugin needs no edit here.

# ── Detect changed paths (for PR test partitioning) ──────────────────
jobs:
  detect-changes:
    name: "Detect changed paths"
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.paths.outputs.plugins }}
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      core: ${{ steps.paths.outputs.core }}
      is-main: ${{ steps.paths.outputs.is-main }}
      cli: ${{ steps.paths.outputs.cli }}
      has-workflow-changes: ${{ steps.paths.outputs.has-workflow-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect paths
        id: paths
        run: |
          discover_plugins() {
            local out=""
            for d in packages/plugins/*/; do
              grep -q '"test"' "$d/package.json" 2>/dev/null && out="$out,$(basename "$d")"
            done
            echo "${out#,}"
          }
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # On main: run everything
            echo "is-main=true" >> $GITHUB_OUTPUT
            echo "plugins=$(discover_plugins)" >> $GITHUB_OUTPUT
            echo "backend=lcyt-backend" >> $GITHUB_OUTPUT
            echo "frontend=lcyt-web" >> $GITHUB_OUTPUT
            echo "core=lcyt" >> $GITHUB_OUTPUT
            echo "cli=lcyt-cli" >> $GITHUB_OUTPUT
            echo "has-workflow-changes=false" >> $GITHUB_OUTPUT
          else
            # PR mode: compare against base
            BASE="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only origin/$BASE...HEAD || echo "")

            # Check for workflow changes (force full suite)
            if echo "$CHANGED" | grep -q "^\.github/workflows/"; then
              echo "has-workflow-changes=true" >> $GITHUB_OUTPUT
              echo "is-main=true" >> $GITHUB_OUTPUT
              echo "plugins=$(discover_plugins)" >> $GITHUB_OUTPUT
              echo "backend=lcyt-backend" >> $GITHUB_OUTPUT
              echo "frontend=lcyt-web" >> $GITHUB_OUTPUT
              echo "core=lcyt" >> $GITHUB_OUTPUT
              echo "cli=lcyt-cli" >> $GITHUB_OUTPUT
            else
              echo "has-workflow-changes=false" >> $GITHUB_OUTPUT
              echo "is-main=false" >> $GITHUB_OUTPUT

              # Parse which packages changed
              PLUGINS=""
              for d in packages/plugins/*/; do
                n=$(basename "$d")
                echo "$CHANGED" | grep -q "^packages/plugins/$n/" && PLUGINS="$PLUGINS,$n"
              done
              PLUGINS=${PLUGINS#,}  # Remove leading comma
              echo "plugins=$PLUGINS" >> $GITHUB_OUTPUT

              # Check backend, frontend, core, cli
              echo "$CHANGED" | grep -q "^packages/lcyt-backend" && BACKEND="lcyt-backend" || BACKEND=""
              echo "backend=$BACKEND" >> $GITHUB_OUTPUT

              echo "$CHANGED" | grep -q "^packages/lcyt-web" && FRONTEND="lcyt-web" || FRONTEND=""
              echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT

              echo "$CHANGED" | grep -q "^packages/lcyt/" && CORE="lcyt" || CORE=""
              echo "core=$CORE" >> $GITHUB_OUTPUT

              echo "$CHANGED" | grep -q "^packages/lcyt-cli" && CLI="lcyt-cli" || CLI=""
              echo "cli=$CLI" >> $GITHUB_OUTPUT
            fi
          fi

# ── Tier 1: Build verification (fastest signal — broken imports) ────
  build:
    name: "Build: ${{ matrix.name }}"
    needs: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lcyt CJS
            cmd: npm run build -w packages/lcyt
          - name: lcyt-web Vite
            cmd: npm run build -w packages/lcyt-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: ${{ matrix.cmd }}

  # ── Tier 2: Unit tests (after build passes) ─────────────────────────
  # Build dynamic package matrix based on detected changes
  build-unit-matrix:
    name: "Prepare unit test matrix"
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build package matrix
        id: matrix
        shell: bash
        run: |
          IS_MAIN="${{ needs.detect-changes.outputs.is-main }}"
          PACKAGES=()

          # Discover every testable Node workspace, including future plugins.
          # Full CI tests all packages; PR CI tests only packages whose paths changed.
          if [[ "$IS_MAIN" == "true" ]]; then
            for d in packages/*/ packages/plugins/*/; do
              d=${d%/}
              [[ -f "$d/package.json" ]] || continue
              grep -q '"test"[[:space:]]*:' "$d/package.json" && PACKAGES+=("$d")
            done
          else
            BASE="${{ github.base_ref }}"
            CHANGED=$(git diff --name-only "origin/$BASE...HEAD" || true)
            PLUGIN_CHANGED=false

            for d in packages/*/ packages/plugins/*/; do
              d=${d%/}
              [[ -f "$d/package.json" ]] || continue
              grep -q '"test"[[:space:]]*:' "$d/package.json" || continue
              if grep -Fq "$d/" <<< "$CHANGED"; then
                PACKAGES+=("$d")
              fi
              if [[ "$d" == packages/plugins/* ]] && grep -Fq "$d/" <<< "$CHANGED"; then
                PLUGIN_CHANGED=true
              fi
            done

            # Plugin changes can affect backend integration and unit behaviour.
            if [[ "$PLUGIN_CHANGED" == "true" ]] &&
               grep -q '"test"[[:space:]]*:' packages/lcyt-backend/package.json &&
               [[ ! " ${PACKAGES[*]} " == *" packages/lcyt-backend "* ]]; then
              PACKAGES+=("packages/lcyt-backend")
            fi
          fi

          # GitHub Actions rejects an empty matrix. Use a no-op sentinel so
          # dependent integration jobs still run their normal conditions.
          if [[ ${#PACKAGES[@]} -eq 0 ]]; then
            JSON_ARRAY='["__none__"]'
          else
            JSON_ARRAY='['
            for i in "${!PACKAGES[@]}"; do
              [[ "$i" -gt 0 ]] && JSON_ARRAY+=","
              JSON_ARRAY+="\"${PACKAGES[$i]}\""
            done
            JSON_ARRAY+=']'
          fi

          echo "Selected Node test packages: $JSON_ARRAY"
          echo "packages=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  unit-node:
    name: "${{ matrix.package == '__none__' && 'Unit: no changed packages' || format('Unit: {0}', matrix.package) }}"
    needs: [build, build-unit-matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.build-unit-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.package != '__none__'
      - uses: actions/setup-node@v4
        if: matrix.package != '__none__'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: matrix.package != '__none__'
      - name: Run unit tests
        if: matrix.package != '__none__'
        run: npm test -w ${{ matrix.package }}
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          ADMIN_KEY: test-admin-key

  unit-python:
    name: "Unit: python ${{ matrix.package }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: python-packages/lcyt
            install: pip install pytest -e .
            cmd: pytest tests/ -v
          - package: python-packages/lcyt-mcp
            install: pip install pytest pytest-asyncio mcp httpx -e ../lcyt
            cmd: PYTHONPATH=. pytest tests/ -v
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.install }}
      - name: Run unit tests
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.cmd }}

  standalone-tests:
    name: "Unit: ${{ matrix.name }}"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lcyt-compute
            dir: packages/lcyt-compute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm install --ignore-scripts
      - name: Run tests
        working-directory: ${{ matrix.dir }}
        run: npm test
        env:
          NODE_ENV: test

  # ── Tier 3: Integration, component, Docker (after unit passes) ──────
  integration-node:
    name: "Integration: lcyt-backend"
    needs: [unit-node, unit-python, standalone-tests, detect-changes]
    if: |
      ${{ needs.detect-changes.outputs.is-main == 'true' ||
          needs.detect-changes.outputs.backend != '' ||
          needs.detect-changes.outputs.plugins != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run backend integration tests
        run: npm run test:integration -w packages/lcyt-backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret
          ADMIN_KEY: test-admin-key

  integration-python:
    name: "Integration: python lcyt-backend"
    needs: unit-python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: python-packages/lcyt-backend
        run: pip install -e ../lcyt -e ".[dev]"
      - name: Run integration tests
        working-directory: python-packages/lcyt-backend
        run: pytest tests/ -v

  component-tests:
    name: "Component: lcyt-web (Vitest)"
    needs: [unit-node, standalone-tests, detect-changes]
    if: |
      ${{ needs.detect-changes.outputs.is-main == 'true' ||
          needs.detect-changes.outputs.frontend != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Vitest component tests
        run: npm run test:components -w packages/lcyt-web
        env:
          NODE_ENV: test

  docker-lint:
    name: "Docker: lint & config"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configs
        run: |
          docker compose -f docker-compose.yml config --quiet
        env:
          JWT_SECRET: ci-placeholder
          BACKEND_INTERNAL_TOKEN: ci-placeholder

      - name: Lint Dockerfiles with hadolint
        run: |
          wget -qO hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint --failure-threshold error \
            Dockerfile \
            docker/lcyt-dsk-renderer/Dockerfile \
            packages/lcyt-mcp-http/Dockerfile \
            packages/lcyt-mcp-stdio/Dockerfile

  docker-build:
    name: "Docker: build ${{ matrix.image }}"
    needs: [docker-lint, unit-node, unit-python, standalone-tests, detect-changes]
    if: ${{ needs.detect-changes.outputs.is-main == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lcyt-site
            context: .
            file: Dockerfile
          - image: lcyt-mcp-http
            context: .
            file: packages/lcyt-mcp-http/Dockerfile
          - image: lcyt-mcp-stdio
            context: .
            file: packages/lcyt-mcp-stdio/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: >
          docker build
          --file ${{ matrix.file }}
          --tag ${{ matrix.image }}:ci
          ${{ matrix.context }}

  script-lint:
    name: "Scripts: shellcheck & syntax"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/entrypoint.sh
          bash -n ci/test-docker.sh

      - name: Shellcheck scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: scripts
          severity: error
      - name: Shellcheck CI helpers
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ci
          severity: error
          
  # ── Tier 4: E2E tests (after integration passes) ───────────────────
  e2e:
    name: "E2E: Playwright"
    needs: [integration-node, component-tests, detect-changes]
    if: |
      ${{ needs.detect-changes.outputs.is-main == 'true' ||
          needs.detect-changes.outputs.backend != '' ||
          needs.detect-changes.outputs.frontend != '' ||
          needs.detect-changes.outputs.plugins != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          npm run build -w packages/lcyt
          npm run build -w packages/lcyt-web
          node packages/lcyt-backend/src/index.js &
        env:
          JWT_SECRET: test-jwt-secret
          ADMIN_KEY: test-admin-key
          PORT: 3000
          STATIC_DIR: packages/lcyt-web/dist
      - name: Run E2E tests
        run: npx playwright test --pass-with-no-tests
        env:
          BASE_URL: http://localhost:3000
