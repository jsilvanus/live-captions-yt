name: Publish images

# Builds and publishes the container images used by the deployment stack (jsilvanus/deploy-media):
#   lcyt              backend + frontend web UI
#   lcyt-fleet-worker DSK graphics + perception worker
#
# Release tags are sequential product versions (v1, v2, v3, ...), not SemVer.
# Automatic releases call this workflow after detecting a changed .github/version/release marker.
# Direct vN tag pushes and manual dispatch are also supported. Manual builds do not move latest.
# Ordinary main pushes and pull requests never publish images.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        description: "Git ref to build for an automated release"
        required: false
        type: string
      release_tag:
        description: "Sequential release tag (for example v12)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lcyt
            file: Dockerfile
          - image: lcyt-fleet-worker
            file: docker/lcyt-fleet-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.release_tag != '' }}
            type=ref,event=tag
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
