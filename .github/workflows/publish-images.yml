name: Publish images

# Builds and publishes the container images the deployment stack (jsilvanus/deploy-media) uses:
#   lcyt              the backend + frontend web UI (Dockerfile) — STATIC_DIR is set in the image
#   lcyt-fleet-worker the fat fffleet worker: DSK graphics + perception (docker/lcyt-fleet-worker)
# Tags: `latest` and `sha-<sha>` from main, `<version>` and `<major>.<minor>` from v*.*.* tags.
# The images are not pushed from pull requests.
#
# Base images (node:22-slim) are pulled from docker.io.
# If you encounter docker.io rate limiting or access issues:
#   - See DOCKER_BUILD_GUIDE.md for local build instructions
#   - Use locally-built images in your deployment stack
#   - Build images in environments with docker.io access, then import into restricted environments

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: lcyt
            file: Dockerfile
          - image: lcyt-fleet-worker
            file: docker/lcyt-fleet-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
